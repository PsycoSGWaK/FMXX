# Deploiement continu vers o2switch.
#
# Calque sur le workflow du portfolio et de timesheets, dont il reprend les
# corrections deja payees (voir ../timesheets/docs/deploiement-github-actions.md
# pour l'historique complet des ecueils). Deux differences notables ici :
#
#   1. Pas d'etape de build : FMXX est du PHP pur (pas de composer.json, pas
#      d'assets a compiler). Le code source arrive entierement par git sur le
#      serveur ; aucun rsync n'est necessaire.
#   2. Le Document Root cPanel pointe directement sur le depot (pas de dossier
#      public/ separe), lecon tiree du premier deploiement de timesheets ou un
#      lien symbolique vers public/ a ete bloque par Apache.
#
# L'acces SSH est ouvert a la volee via l'API cPanel SshWhitelist, car le
# pare-feu d'o2switch filtre par IP source et les runners GitHub ont des IP
# imprevisibles.

name: Deploiement o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Deux deploiements simultanes se marcheraient dessus, et la liste blanche
  # SSH est un etat partage limite a 5 entrees.
  group: o2switch-deploy-fmxx
  cancel-in-progress: false

env:
  REPO_DISTANT: repositories/FMXX
  BASE_URL: https://fmxx.idevnormandie.fr

jobs:
  deploiement:
    name: Deploie
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recupere l'IP publique du runner
        id: ip
        run: |
          IP="$(curl -fsS --retry 3 --retry-delay 2 -m 15 https://api.ipify.org)"
          if [ -z "$IP" ]; then
            echo "::error::Impossible de determiner l'IP publique du runner."
            exit 1
          fi
          echo "IP du runner : $IP"
          echo "ipv4=$IP" >> "$GITHUB_OUTPUT"

      - name: Vide la liste blanche SSH
        # La liste est plafonnee a 5 entrees et se remplit d'IP de runners
        # disparues, ce qui finit par bloquer tout deploiement. On repart donc
        # d'une liste vide a chaque execution.
        #
        # Choix assume : cela efface aussi l'IP personnelle, dont depend l'acces
        # SSH manuel. Il faut la re-autoriser depuis cPanel apres un deploiement.
        run: |
          REPONSE="$(curl -sS -m 60 \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/remove_all")"
          echo "Reponse API : $REPONSE"
          echo "$REPONSE" | jq -e '.status == 1' > /dev/null \
            || { echo "::error::Le vidage de la liste blanche a echoue."; exit 1; }

      - name: Ouvre l'acces SSH pour l'IP du runner
        id: whitelist
        run: |
          # Quelques tentatives : une suppression met, d'apres la documentation,
          # jusqu'a quelques minutes a liberer sa place.
          for TENTATIVE in 1 2 3; do
            REPONSE="$(curl -sS -m 60 \
              -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
              "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22")"
            echo "Tentative $TENTATIVE - reponse API : $REPONSE"
            if echo "$REPONSE" | jq -e '.status == 1' > /dev/null; then
              echo "ajoutee=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$TENTATIVE" -lt 3 ] && sleep 45
          done
          echo "::error::L'ajout en liste blanche a echoue apres 3 tentatives."
          exit 1

      - name: Installe la cle SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.O2SWITCH_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host cible
            HostName ${{ secrets.CPANEL_SERVER }}
            User ${{ secrets.CPANEL_USERNAME }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Met le code source a jour depuis git
        # config.php n'est jamais versionne (gitignore) : un `git reset --hard`
        # ne touche pas aux fichiers non suivis, il reste donc intact.
        run: |
          ssh cible "set -e
            cd ~/$REPO_DISTANT
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            echo \"Code source sur \$(git rev-parse --short HEAD)\""

      - name: Verifie que le site repond
        run: |
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 -m 30 "$BASE_URL/")"
          echo "$BASE_URL/ -> $CODE"
          [ "$CODE" = "200" ] || { echo "::error::$BASE_URL/ renvoie $CODE au lieu de 200."; exit 1; }

      - name: Referme l'acces SSH
        # Toujours executee : la liste blanche est limitee a 5 entrees, on n'y
        # laisse pas s'accumuler des IP de runners disparus.
        if: always() && steps.whitelist.outputs.ajoutee == 'true'
        run: |
          REPONSE="$(curl -sS -m 45 \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/remove?address=${{ steps.ip.outputs.ipv4 }}&port=22&direction=in")"
          echo "Reponse API : $REPONSE"
          echo "$REPONSE" | jq -e '.status == 1' > /dev/null \
            || echo "::warning::La suppression de l'IP du runner a echoue. Le prochain deploiement videra la liste, mais verifiez cPanel si le probleme persiste."

      - name: Efface la cle SSH
        if: always()
        run: rm -rf ~/.ssh/id_deploy ~/.ssh/config
